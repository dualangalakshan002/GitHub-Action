name: Jobs Practice

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build
        run: |
          echo "Building...."
          sleep 10
          echo "hello from build" > result.txt
          ls
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: my-result
          path: result.txt
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Test
        run: |
          echo "Testing...."
          sleep 10                  
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Lint
        run: |
          echo "Linting...."
          sleep 5
  deploy:
    runs-on: ubuntu-latest
    needs: [build, test, lint]
    steps:
      - name: Download result
        uses: actions/download-artifact@v4
        with:
          name: my-result
      - name: Deploy
        run: |
          echo "Deploying..."
          ls
          cat result.txt