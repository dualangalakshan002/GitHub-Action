name: Jobs Practice

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build
        run: |
          echo "Building...."
          sleep 10
          echo "hello from build" > result.txt
          ls
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Test
        run: |
          echo "Testing...."
          sleep 10
          
          
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Lint
        run: |
          echo "Linting...."
          sleep 10
  deploy:
    runs-on: ubuntu-latest
    needs: [build, test, lint]
    steps:
      - name: Deploy
        run: |
          echo "Deploying..."
          ls
          cat result.txt