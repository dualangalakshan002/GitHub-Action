name: Secrets Practice

on: workflow_dispatch

env:
  GREETING: "Hello, World!"

jobs:
  show:
    runs-on: ubuntu-latest
    env:
      CITY: colombo
    steps:
      - name: Env variables
        run: echo "$GREETING from $CITY"

      - name: override CITY in this step
        env:
          CITY: kandy
        run: echo "$GREETING from $CITY"
    
      - name: Repository variable
        run: echo "App name is ${{ vars.APP_NAME }}"

      - name: print secret (try it!)
        run: echo "Secret is ${{ secrets.MY_SECRET }}"

      - name: Use secret the right way
        env:
          API_KEY: ${{ secrets.MY_SECRET }}
        run: |
          if [ -n "$API_KEY" ]; then
            echo "Secret is have  (length: ${#API_KEY})"
          else
            echo "Secret does not exist or is empty"
          fi